server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests
    location /api/ {
        # Rewrite /api/users -> /users
        rewrite ^/api/(.*)$ /$1 break;
        
        # REPLACE THIS WITH YOUR ACTUAL CLOUD BACKEND URL
        # For example: https://sentry-backend.chbk.app
        proxy_pass http://backend:8000;
        
        proxy_ssl_server_name on; # Required for SNI (Cloudflare/Heroku/Railway)
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Websockets
    location /ws/ {
        # REPLACE THIS WITH YOUR ACTUAL CLOUD BACKEND URL
        # For example: https://sentry-backend.chbk.app
        proxy_pass http://backend:8000;
        
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $proxy_host; # Important for backend routing
        
        # Timeout settings for long-lived WS connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
